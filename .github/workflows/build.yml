name: Build My Weird Desktop Buddy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract project ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path "MyWeirdDesktopBuddy_v1.0_source.zip" -DestinationPath "source" -Force

      - name: Publish Windows EXE
        shell: pwsh
        run: |
          dotnet publish "source\MyWeirdDesktopBuddy\MyWeirdDesktopBuddy.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "dist"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyWeirdDesktopBuddy-Windows
          path: dist/MyWeirdDesktopBuddy.exe
          if-no-files-found: error
